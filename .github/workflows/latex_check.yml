name: General LaTeX Check
on:
  pull_request:
    paths:
      - '**.tex'

jobs:
  build-changed-tex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Compile each changed file
        run: |
          # Get files changed in this PR compared to the base branch
          FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep '\.tex$' || true)
          
          if [ -z "$FILES" ]; then
            echo "No .tex files to compile."
            exit 0
          fi

          for file in $FILES; do
            echo "Compiling $file..."
            
            # Get the directory of the file so we can run the command from there
            # This ensures images/styles in that folder are found.
            DIR=$(dirname "$file")
            FILENAME=$(basename "$file")

            docker run --rm -v "$(pwd):/workdir" -w "/workdir/$DIR" \
              texlive/texlive:latest \
              pdflatex -interaction=nonstopmode -halt-on-error "$FILENAME"

            if [ $? -ne 0 ]; then
              echo "Error: $file failed to compile."
              exit 1
            fi
          done