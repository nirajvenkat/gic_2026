name: General LaTeX Check
on:
  pull_request:
    paths:
      - '**.tex'
  push:
    branches: [main]
    paths: ['**.tex']

jobs:
  build-changed-tex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Install Tectonic and Fonts
        run: |
          # 1. Install Microsoft Core Fonts (Times New Roman)
          sudo apt-get update
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer
          
          # 2. Refresh font cache so Tectonic can see them
          sudo fc-cache -f -v

          # 3. Install Tectonic
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/

      - name: Compile each changed file
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep '\.tex$' || true)
          else
            FILES=$(git diff --name-only HEAD^ HEAD | grep '\.tex$' || true)
          fi

          if [ -z "$FILES" ]; then
            echo "No .tex files to compile."
            exit 0
          fi

          for file in $FILES; do
            echo "--------------------------------------------------"
            echo "Compiling with Tectonic: $file"
            echo "--------------------------------------------------"
            
            # Tectonic will download only the needed packages on the fly
            tectonic "$file"

            if [ $? -ne 0 ]; then
              echo "Error: $file failed to compile."
              exit 1
            fi
          done