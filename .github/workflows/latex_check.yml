name: General LaTeX Check
on:
  pull_request:
    paths:
      - '**.tex'
  push:
    branches: [main]
    paths: ['**.tex']

jobs:
  build-changed-tex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # Tectonic setup is much faster than pulling a 5GB Docker image
      - name: Setup Tectonic
        uses: neowit/setup-tectonic@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile each changed file
        run: |
          # Detect changed files based on trigger type
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep '\.tex$' || true)
          else
            # Handles direct pushes to main
            FILES=$(git diff --name-only HEAD^ HEAD | grep '\.tex$' || true)
          fi

          if [ -z "$FILES" ]; then
            echo "No .tex files to compile."
            exit 0
          fi

          for file in $FILES; do
            echo "--------------------------------------------------"
            echo "Compiling with Tectonic: $file"
            echo "--------------------------------------------------"
            
            # Tectonic automatically handles multiple passes (bibtex, etc.) 
            # and only downloads the packages you actually use.
            tectonic "$file"

            if [ $? -ne 0 ]; then
              echo "Error: $file failed to compile."
              exit 1
            fi
          done