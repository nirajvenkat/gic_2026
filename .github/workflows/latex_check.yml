name: General LaTeX Check
on:
  pull_request:
    paths:
      - '**.tex'
  push:
    branches: [main]
    paths: ['**.tex']

jobs:
  build-changed-tex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Tectonic
        run: |
          # Use mamba to install tectonic quickly
          sudo apt-get update
          sudo apt-get install -y tectonic

      - name: Compile each changed file
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep '\.tex$' || true)
          else
            FILES=$(git diff --name-only HEAD^ HEAD | grep '\.tex$' || true)
          fi

          if [ -z "$FILES" ]; then
            echo "No .tex files to compile."
            exit 0
          fi

          for file in $FILES; do
            echo "Compiling with Tectonic: $file"
            tectonic "$file"
          done