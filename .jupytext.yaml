# Jupytext configuration: declarative pairing of .py ↔ .ipynb
# Add new pairs here as you create notebooks

# Default format: keep both .py and .ipynb in sync
formats: "py,ipynb"

# Metadata to preserve
notebook_metadata_filter:
  notebook:
    - jupytext
    - kernelspec
    - language_info
  cells: []

# Per-notebook overrides (add more as needed)
notebooks:
  - source: doe/phase_2/code/grid_opt.py
    target: doe/phase_2/code/grid_opt.ipynb
  - source: doe/phase_2/code/ieee39_dataset.py
    target: doe/phase_2/code/ieee39_dataset.ipynb
  - source: mitsubishi/phase_2/code/gqe.py
    target: mitsubishi/phase_2/code/gqe.ipynb

  # Add more pairs here when you create new notebooks
  # - source: path/to/new_notebook.py
  #   target: path/to/new_notebook.ipynb
